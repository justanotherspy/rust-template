name: Zizmor

# Static analysis of the workflows themselves: template injection, excessive
# permissions, unpinned actions, cache poisoning, persisted credentials.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action uploads its findings as SARIF to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
