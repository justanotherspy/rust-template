# cargo-deny: supply-chain policy for the dependency graph (`make deny`, and
# the `deny` job in CI). Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# RustSec advisories: every vulnerability, unmaintained or unsound crate
# fails the check. Ignore one only with its id and a reason.
[advisories]
yanked = "deny"
ignore = []

# Licences a dependency may carry. Add to the list deliberately.
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: an allowance nothing uses yet is fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Crates come from crates.io only: no git dependencies, no other registry.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
